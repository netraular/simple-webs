<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>webs.raular.com — Herramientas y calculadoras</title>
<meta name="description" content="Colección de webs, herramientas y calculadoras autohospedadas.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>🧰</text></svg>">
<style>
  :root {
    --bg: #0d1117;
    --bg-soft: #161b22;
    --card: #161b22;
    --card-hover: #1c2330;
    --border: #262d3a;
    --border-hover: #3b82f6;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #6366f1;
    --accent-2: #8b5cf6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  a { color: inherit; text-decoration: none; }

  header {
    padding: 4rem 1.5rem 2.5rem;
    text-align: center;
    background:
      radial-gradient(1200px 400px at 50% -10%, rgba(99,102,241,0.18), transparent 70%),
      linear-gradient(180deg, var(--bg-soft), var(--bg));
    border-bottom: 1px solid var(--border);
  }
  header .kicker {
    display: inline-block;
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 0.75rem;
  }
  header h1 {
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  header p {
    color: var(--muted);
    margin-top: 0.75rem;
    font-size: 1.05rem;
    max-width: 42rem;
    margin-left: auto;
    margin-right: auto;
  }

  main {
    flex: 1;
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 4rem;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1.25rem;
  }

  .card {
    display: flex;
    flex-direction: column;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.5rem;
    transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    height: 100%;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: var(--border-hover);
    background: var(--card-hover);
    box-shadow: 0 12px 30px -12px rgba(59,130,246,0.35);
  }
  .card .icon {
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    font-size: 1.6rem;
    border-radius: 12px;
    background: linear-gradient(135deg, rgba(99,102,241,0.22), rgba(139,92,246,0.22));
    border: 1px solid var(--border);
    margin-bottom: 1rem;
  }
  .card .tag {
    align-self: flex-start;
    font-size: 0.7rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--accent);
    background: rgba(99,102,241,0.12);
    border: 1px solid rgba(99,102,241,0.25);
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    margin-bottom: 0.75rem;
  }
  .card h2 {
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .card p {
    color: var(--muted);
    font-size: 0.92rem;
    margin-top: 0.5rem;
    flex: 1;
  }
  .card .go {
    margin-top: 1.1rem;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--accent);
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
  }
  .card:hover .go { color: #a5b4fc; }
  .card .go svg { transition: transform 0.15s ease; }
  .card:hover .go svg { transform: translateX(3px); }

  .state {
    text-align: center;
    color: var(--muted);
    padding: 3rem 1rem;
    font-size: 0.95rem;
  }
  .state code {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.1rem 0.4rem;
    font-size: 0.85em;
  }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.82rem;
    padding: 2rem 1.5rem;
    border-top: 1px solid var(--border);
  }
  footer a { color: var(--accent); }
</style>
</head>
<body>
  <header>
    <span class="kicker">webs.raular.com</span>
    <h1>Herramientas &amp; calculadoras</h1>
    <p>Pequeñas webs autohospedadas. Se publican solas: cada archivo del repositorio aparece aquí automáticamente.</p>
  </header>

  <main>
    <div id="grid" class="grid" hidden></div>
    <div id="state" class="state">Cargando…</div>
  </main>

  <footer>
    Servido por nginx + git-sync desde
    <a href="https://github.com/netraular/simple-webs">github.com/netraular/simple-webs</a>.
    Añade un <code>.html</code> al repo y aparecerá aquí.
  </footer>

<script>
(async function () {
  const grid = document.getElementById('grid');
  const state = document.getElementById('state');

  // Prettify a filename into a fallback title: strip .html, split on -/_,
  // capitalise each word.
  function prettify(name) {
    return name
      .replace(/\.html?$/i, '')
      .replace(/[-_]+/g, ' ')
      .replace(/\s+/g, ' ')
      .trim()
      .replace(/\b\w/g, c => c.toUpperCase());
  }

  const arrow = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

  try {
    // Optional per-page metadata (title/description/emoji/tag).
    let meta = {};
    try {
      const m = await fetch('webs.json', { cache: 'no-cache' });
      if (m.ok) meta = await m.json();
    } catch (_) { /* metadata is optional */ }

    // Auto-discover pages from nginx's JSON directory listing.
    const res = await fetch('_list/', { cache: 'no-cache' });
    if (!res.ok) throw new Error('listing ' + res.status);
    const entries = await res.json();

    const pages = entries
      .filter(e => e.type === 'file' && /\.html?$/i.test(e.name) && e.name.toLowerCase() !== 'index.html')
      .map(e => {
        const m = meta[e.name] || {};
        return {
          href: e.name,
          title: m.title || prettify(e.name),
          description: m.description || '',
          emoji: m.emoji || '📄',
          tag: m.tag || '',
          mtime: e.mtime ? Date.parse(e.mtime) : 0
        };
      })
      .sort((a, b) => a.title.localeCompare(b.title, 'es'));

    if (!pages.length) {
      state.textContent = 'Aún no hay páginas publicadas. Añade un .html al repositorio.';
      return;
    }

    grid.innerHTML = pages.map(p => `
      <a class="card" href="${encodeURI(p.href)}">
        <div class="icon">${p.emoji}</div>
        ${p.tag ? `<span class="tag">${p.tag}</span>` : ''}
        <h2>${p.title}</h2>
        ${p.description ? `<p>${p.description}</p>` : '<p></p>'}
        <span class="go">Abrir ${arrow}</span>
      </a>
    `).join('');

    state.hidden = true;
    grid.hidden = false;
  } catch (err) {
    state.innerHTML = 'No se pudo cargar el listado. Reintenta en unos segundos.';
    console.error(err);
  }
})();
</script>
</body>
</html>
