<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>webs.raular.com</title>
<meta name="description" content="A collection of small self-hosted web pages, tools and calculators.">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f7f9">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1117">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>🧰</text></svg>">
<style>
  /* Minimal, adapts to the device's light/dark preference. */
  :root{
    color-scheme: light dark;
    --bg:#f6f7f9; --card:#ffffff; --thumb:#ffffff; --border:#e6e8ec;
    --border-hover:#d3d7de; --text:#1f2328; --muted:#6b7280; --accent:#2563eb;
    --shadow:rgba(17,24,39,.35);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0d1117; --card:#161b22; --thumb:#161b22; --border:#262d3a;
      --border-hover:#3b82f6; --text:#e6edf3; --muted:#8b949e; --accent:#3b82f6;
      --shadow:rgba(0,0,0,.55);
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh;
    display:flex;flex-direction:column;
  }
  a{color:inherit;text-decoration:none}

  main{flex:1;width:100%;max-width:1120px;margin:0 auto;padding:3.5rem 1.5rem 4rem}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.75rem}

  .card{
    background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;
    transition:box-shadow .18s ease,transform .18s ease,border-color .18s ease;
  }
  .card:hover{
    transform:translateY(-3px);border-color:var(--border-hover);
    box-shadow:0 10px 24px -14px var(--shadow);
  }

  /* Live preview: an iframe of the page itself, rendered at 4× the card width
     (desktop layout) and scaled to 0.25 so it fits. Non-interactive — the whole
     card is the link. */
  .thumb{position:relative;aspect-ratio:16/10;overflow:hidden;background:var(--thumb);border-bottom:1px solid var(--border)}
  .thumb iframe{position:absolute;top:0;left:0;width:400%;height:400%;border:0;transform:scale(.25);transform-origin:top left;pointer-events:none}

  .body{padding:1.1rem 1.25rem 1.4rem}
  .body h2{font-size:1.05rem;font-weight:650;letter-spacing:-.01em}
  .body p{color:var(--muted);font-size:.9rem;margin-top:.35rem}

  .state{text-align:center;color:var(--muted);padding:3rem 1rem;font-size:.95rem}

  footer{text-align:center;padding:2.25rem 1.5rem}
  footer a{color:var(--muted);font-size:.85rem;letter-spacing:.02em}
  footer a:hover{color:var(--accent)}
</style>
</head>
<body>
  <main>
    <div id="grid" class="grid" hidden></div>
    <div id="state" class="state">Loading…</div>
  </main>

  <footer>
    <a href="https://raular.com">raular.com</a>
  </footer>

<script>
(async function () {
  const grid = document.getElementById('grid');
  const state = document.getElementById('state');

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  // Prettify a filename into a fallback title: strip .html, split on -/_,
  // capitalise each word.
  function prettify(name) {
    return name
      .replace(/\.html?$/i, '')
      .replace(/[-_]+/g, ' ')
      .replace(/\s+/g, ' ')
      .trim()
      .replace(/\b\w/g, c => c.toUpperCase());
  }

  try {
    // Optional per-page metadata (title/description).
    let meta = {};
    try {
      const m = await fetch('webs.json', { cache: 'no-cache' });
      if (m.ok) meta = await m.json();
    } catch (_) { /* metadata is optional */ }

    // Auto-discover pages from nginx's JSON directory listing. /_list/ maps to
    // the pages/ subfolder, so every entry is a publishable page (the landing
    // itself, webs.json and favicon.ico live at the repo root, out of the way).
    const res = await fetch('_list/', { cache: 'no-cache' });
    if (!res.ok) throw new Error('listing ' + res.status);
    const entries = await res.json();

    const pages = entries
      .filter(e => e.type === 'file' && /\.html?$/i.test(e.name) && e.name.toLowerCase() !== 'index.html')
      .map(e => {
        const m = meta[e.name] || {};
        return {
          href: 'pages/' + e.name,
          title: m.title || prettify(e.name),
          description: m.description || ''
        };
      })
      .sort((a, b) => a.title.localeCompare(b.title, 'en'));

    if (!pages.length) {
      state.textContent = 'No pages published yet. Add an .html to the pages/ folder.';
      return;
    }

    grid.innerHTML = pages.map(p => {
      const href = encodeURI(p.href);
      const title = escapeHtml(p.title);
      return `
      <a class="card" href="${href}">
        <div class="thumb">
          <iframe src="${href}" title="${title} preview" loading="lazy" scrolling="no" tabindex="-1" aria-hidden="true"></iframe>
        </div>
        <div class="body">
          <h2>${title}</h2>
          ${p.description ? `<p>${escapeHtml(p.description)}</p>` : ''}
        </div>
      </a>`;
    }).join('');

    state.hidden = true;
    grid.hidden = false;
  } catch (err) {
    state.textContent = "Couldn't load the list. Try again in a few seconds.";
    console.error(err);
  }
})();
</script>
</body>
</html>
