<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>webs.raular.com</title>
<meta name="description" content="A collection of small self-hosted web pages, tools and calculators.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>🧰</text></svg>">
<style>
  :root {
    --bg: #0d1117;
    --bg-soft: #161b22;
    --card: #161b22;
    --card-hover: #1c2330;
    --border: #262d3a;
    --border-hover: #3b82f6;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #6366f1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  a { color: inherit; text-decoration: none; }

  main {
    flex: 1;
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    padding: 3rem 1.5rem 4rem;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1.5rem;
  }

  .card {
    display: flex;
    flex-direction: column;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    height: 100%;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: var(--border-hover);
    background: var(--card-hover);
    box-shadow: 0 12px 30px -12px rgba(59,130,246,0.35);
  }

  /* Live preview: an iframe of the page itself, rendered at 4× the card width
     (desktop layout) and scaled to 0.25 so it fits. Non-interactive — the whole
     card is the link. */
  .thumb {
    position: relative;
    aspect-ratio: 16 / 10;
    overflow: hidden;
    background: var(--bg-soft);
    border-bottom: 1px solid var(--border);
  }
  .thumb iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 400%;
    height: 400%;
    border: 0;
    transform: scale(0.25);
    transform-origin: top left;
    pointer-events: none;
  }
  .thumb::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 70%, rgba(13,17,23,0.15));
  }

  .card .body { padding: 1.1rem 1.25rem 1.35rem; }
  .card h2 {
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .card p {
    color: var(--muted);
    font-size: 0.9rem;
    margin-top: 0.4rem;
  }

  .state {
    text-align: center;
    color: var(--muted);
    padding: 3rem 1rem;
    font-size: 0.95rem;
  }

  footer {
    text-align: center;
    padding: 2rem 1.5rem;
    border-top: 1px solid var(--border);
  }
  footer a {
    color: var(--muted);
    font-size: 0.85rem;
    letter-spacing: 0.02em;
  }
  footer a:hover { color: var(--accent); }
</style>
</head>
<body>
  <main>
    <div id="grid" class="grid" hidden></div>
    <div id="state" class="state">Loading…</div>
  </main>

  <footer>
    <a href="https://raular.com">raular.com</a>
  </footer>

<script>
(async function () {
  const grid = document.getElementById('grid');
  const state = document.getElementById('state');

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  // Prettify a filename into a fallback title: strip .html, split on -/_,
  // capitalise each word.
  function prettify(name) {
    return name
      .replace(/\.html?$/i, '')
      .replace(/[-_]+/g, ' ')
      .replace(/\s+/g, ' ')
      .trim()
      .replace(/\b\w/g, c => c.toUpperCase());
  }

  try {
    // Optional per-page metadata (title/description).
    let meta = {};
    try {
      const m = await fetch('webs.json', { cache: 'no-cache' });
      if (m.ok) meta = await m.json();
    } catch (_) { /* metadata is optional */ }

    // Auto-discover pages from nginx's JSON directory listing.
    const res = await fetch('_list/', { cache: 'no-cache' });
    if (!res.ok) throw new Error('listing ' + res.status);
    const entries = await res.json();

    const pages = entries
      .filter(e => e.type === 'file' && /\.html?$/i.test(e.name) && e.name.toLowerCase() !== 'index.html')
      .map(e => {
        const m = meta[e.name] || {};
        return {
          href: e.name,
          title: m.title || prettify(e.name),
          description: m.description || ''
        };
      })
      .sort((a, b) => a.title.localeCompare(b.title, 'en'));

    if (!pages.length) {
      state.textContent = 'No pages published yet. Add an .html to the repository.';
      return;
    }

    grid.innerHTML = pages.map(p => {
      const href = encodeURI(p.href);
      const title = escapeHtml(p.title);
      return `
      <a class="card" href="${href}">
        <div class="thumb">
          <iframe src="${href}" title="${title} preview" loading="lazy" scrolling="no" tabindex="-1" aria-hidden="true"></iframe>
        </div>
        <div class="body">
          <h2>${title}</h2>
          ${p.description ? `<p>${escapeHtml(p.description)}</p>` : ''}
        </div>
      </a>`;
    }).join('');

    state.hidden = true;
    grid.hidden = false;
  } catch (err) {
    state.innerHTML = "Couldn't load the list. Try again in a few seconds.";
    console.error(err);
  }
})();
</script>
</body>
</html>
