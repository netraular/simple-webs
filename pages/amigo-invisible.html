<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Visor de resultados del amigo invisible.">
<title>Amigo invisible</title>
<style>
:root{--ink:#162f27;--muted:#4b6158;--green:#215846;--cream:#fbfaf5;--paper:#fff;--line:#cbd8cc;--gold:#79461c;--wash:#efeee2;--red:#983c39}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:repeating-linear-gradient(90deg,transparent 0 31px,#dbe4d856 31px 32px) top/100% 180px no-repeat,var(--cream);font:16px/1.5 "Trebuchet MS",sans-serif;letter-spacing:0}
main{width:min(100% - 32px,720px);margin:0 auto;padding:24px 0 40px}
a{color:var(--green);text-underline-offset:3px}
.back{display:inline-flex;align-items:center;min-height:44px;font-size:14px}
.masthead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:24px 0;position:relative;border-bottom:1px solid var(--line)}
.masthead::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:repeating-linear-gradient(125deg,var(--green) 0 9px,var(--cream) 9px 13px,var(--red) 13px 22px,var(--cream) 22px 26px)}
h1{margin:0;font:normal 54px/1.05 Georgia,serif;overflow-wrap:anywhere}
.stamp{width:58px;height:58px;display:grid;place-items:center;flex:none;border:1px solid var(--line);border-radius:4px;color:var(--green);background:var(--paper)}
.icon{display:inline-block;width:18px;height:18px;flex:none;background:currentColor;mask:var(--icon) center/contain no-repeat}
.gift{width:29px;height:29px;--icon:url('https://cdn.jsdelivr.net/npm/lucide-static@0.468.0/icons/gift.svg')}
.file{--icon:url('https://cdn.jsdelivr.net/npm/lucide-static@0.468.0/icons/folder-open.svg')}
.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;padding:16px 0}
button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:6px 13px;border:1px solid var(--green);border-radius:4px;background:var(--green);color:var(--paper);font:inherit;cursor:pointer}
button:hover{background:var(--ink)}
button:disabled{opacity:.65;cursor:default}
.close{border-color:var(--line);background:transparent;color:var(--ink)}
.close:hover{background:var(--wash)}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
[hidden]{display:none!important}
#status{margin:0;color:var(--muted);font-size:14px}
#status.error{color:var(--red)}
table{width:100%;table-layout:fixed;border-collapse:collapse;text-align:left;background:var(--paper)}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
thead th{background:var(--green);color:var(--paper);font-size:14px}
tbody tr:nth-child(even){background:#f3f6f1}
.fixed{display:inline-block;margin-inline-start:8px;padding:1px 5px;border:1px solid #e8d4af;border-radius:4px;background:#fcf1dc;color:var(--gold);font-size:12px;vertical-align:1px}
@media(max-width:480px){main{padding-top:12px}h1{font-size:38px}.stamp{width:44px;height:44px}.gift{width:23px;height:23px}.fixed{margin-inline-start:4px}}
</style>
</head>
<body>
<main>
  <a class="back" href="../index.html">&larr; Todas las webs</a>
  <header class="masthead">
    <h1>Amigo invisible</h1>
    <span class="stamp" aria-hidden="true"><span class="icon gift"></span></span>
  </header>
  <div class="toolbar">
    <button id="open" type="button"><span class="icon file" aria-hidden="true"></span>Abrir sorteo</button>
    <input id="file" type="file" accept=".json,application/json" hidden>
    <button id="close" class="close" type="button" hidden>Cerrar sorteo</button>
    <p id="status" role="status">Ning&uacute;n sorteo abierto.</p>
  </div>
  <table id="results" aria-label="Asignaciones del sorteo" hidden>
    <thead><tr><th scope="col">Regala</th><th scope="col">Recibe</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <noscript><p>El visor requiere JavaScript.</p></noscript>
</main>
<script>
const openButton = document.getElementById('open');
const fileInput = document.getElementById('file');
const closeButton = document.getElementById('close');
const statusMessage = document.getElementById('status');
const results = document.getElementById('results');
const rows = document.getElementById('rows');

function setStatus(message, error = false) {
  statusMessage.textContent = message;
  statusMessage.classList.toggle('error', error);
}

function clearResults() {
  rows.replaceChildren();
  results.hidden = true;
  closeButton.hidden = true;
}

function isDraw(data) {
  if (!Array.isArray(data) || data.length < 2 || !data.every(entry => entry
    && typeof entry.regala === 'string' && entry.regala.trim()
    && typeof entry.recibe === 'string' && entry.recibe.trim()
    && entry.regala !== entry.recibe && typeof entry.fija === 'boolean')) return false;
  const givers = new Set(data.map(entry => entry.regala));
  const recipients = new Set(data.map(entry => entry.recibe));
  return givers.size === data.length && recipients.size === data.length
    && data.every(entry => givers.has(entry.recibe));
}

openButton.addEventListener('click', () => fileInput.click());
closeButton.addEventListener('click', () => {
  clearResults();
  setStatus('Ning\u00fan sorteo abierto.');
  openButton.focus();
});

fileInput.addEventListener('change', async () => {
  const [file] = fileInput.files;
  if (!file) return;
  fileInput.value = '';
  clearResults();
  setStatus('Abriendo sorteo\u2026');
  openButton.disabled = true;
  try {
    const data = JSON.parse(await file.text());
    if (!isDraw(data)) throw new Error('Invalid draw');
    for (const entry of data) {
      const row = rows.insertRow();
      const giver = document.createElement('th');
      giver.scope = 'row';
      giver.textContent = entry.regala;
      row.append(giver);
      const recipient = row.insertCell();
      recipient.textContent = entry.recibe;
      if (entry.fija) {
        const label = document.createElement('span');
        label.className = 'fixed';
        label.textContent = 'Fija';
        recipient.append(' ', label);
      }
    }
    results.hidden = false;
    closeButton.hidden = false;
    setStatus(`${data.length} participantes`);
  } catch {
    clearResults();
    setStatus('No se pudo abrir un sorteo v\u00e1lido.', true);
  } finally {
    openButton.disabled = false;
    openButton.focus();
  }
});
</script>
</body>
</html>
