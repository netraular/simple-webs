<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amigo invisible</title>
<style>
:root{--ink:#162f27;--muted:#4b6158;--green:#215846;--cream:#fbfaf5;--paper:#fff;--line:#cbd8cc;--gold:#79461c;--red:#983c39}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:repeating-linear-gradient(90deg,transparent 0 31px,#dbe4d856 31px 32px) top/100% 180px no-repeat,var(--cream);font:16px/1.5 "Trebuchet MS",sans-serif;letter-spacing:0}
main{width:min(100% - 32px,720px);margin:0 auto;padding:24px 0 40px}
.masthead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:24px 0 18px;position:relative}
.masthead::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:repeating-linear-gradient(125deg,var(--green) 0 9px,var(--cream) 9px 13px,var(--red) 13px 22px,var(--cream) 22px 26px)}
h1{margin:0;font:normal 54px/1.05 Georgia,serif;overflow-wrap:anywhere}
.summary{margin:6px 0 0;color:var(--muted);font-size:14px}
.stamp{width:58px;height:58px;display:grid;place-items:center;flex:none;border:1px solid var(--line);border-radius:4px;color:var(--green);background:var(--paper)}
.gift{width:29px;height:29px}
table{width:100%;table-layout:fixed;border-collapse:collapse;text-align:left;background:var(--paper)}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
thead th{background:var(--green);color:var(--paper);font-size:14px}
tbody tr:nth-child(even){background:#f3f6f1}
.fixed{display:inline-block;margin-inline-start:8px;padding:1px 5px;border:1px solid #e8d4af;border-radius:4px;background:#fcf1dc;color:var(--gold);font-size:12px;vertical-align:1px}
@media(max-width:480px){main{padding-top:16px}h1{font-size:38px}.stamp{width:44px;height:44px}.gift{width:23px;height:23px}.fixed{margin-inline-start:4px}}
</style>
</head>
<body>
<main>
  <header class="masthead">
    <div><h1>Amigo invisible</h1><p class="summary">11 participantes</p></div>
    <span class="stamp" aria-hidden="true">
      <svg class="gift" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="8" width="18" height="4" rx="1"/>
        <path d="M12 8v13M19 12v8a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1v-8M7.5 8a2.5 2.5 0 1 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 1 1 0 5"/>
      </svg>
    </span>
  </header>
  <table aria-label="Asignaciones del sorteo">
    <thead><tr><th scope="col">Quien regala</th><th scope="col">Quien recibe</th></tr></thead>
    <tbody>
      <tr><th scope="row">Rosa</th><td>Joel</td></tr>
      <tr><th scope="row">Aleix</th><td>David</td></tr>
      <tr><th scope="row">Andrea</th><td>Barbara</td></tr>
      <tr><th scope="row">Barbara</th><td>Gerard <span class="fixed">Fija</span></td></tr>
      <tr><th scope="row">Gerard</th><td>Micaela</td></tr>
      <tr><th scope="row">Joaquin</th><td>Rosa</td></tr>
      <tr><th scope="row">Joel</th><td>Aleix</td></tr>
      <tr><th scope="row">Engracia</th><td>Joaquin</td></tr>
      <tr><th scope="row">David</th><td>Marina <span class="fixed">Fija</span></td></tr>
      <tr><th scope="row">Marina</th><td>Andrea</td></tr>
      <tr><th scope="row">Micaela</th><td>Engracia</td></tr>
    </tbody>
  </table>
</main>
</body>
</html>
